<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - Thai-China Tour</title>
    <link rel="shortcut icon" href="/static/images/flag.png"type="image/png"/>
    <style>
        /* ล้างค่าขอบเริ่มต้นของเบราว์เซอร์ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* ป้องกันไม่ให้เกิดแถบเลื่อน (Scrollbar) */
            font-family: sans-serif;
            background-color: #ffffff; /* สีพื้นหลังส่วนที่เหลือกรณีรูปไม่เต็มสัดส่วนจอ (เปลี่ยนเป็นสีธีมเว็บได้) */
        }

        /* จัดรูปพื้นหลังให้เต็มหน้าจอพอดี */
        .splash-screen {
            width: 100%;
            height: 100dvh; /* ใช้ dvh แทน vh เพื่อไม่ให้เลยขอบบน-ล่างในเบราว์เซอร์มือถือ */
            background-image: url('/static/images/thai-chaina.png');
            background-size: contain; /* เปลี่ยนจาก cover เป็น contain เพื่อให้เห็นรูปครบ 100% */
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ใส่เงามืดจางๆ ทับพื้นหลังเล็กน้อยเพื่อให้ตัวหมุนเด่นขึ้น (ปรับลดได้) */
        .splash-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(76, 75, 75, 0.2); 
        }

        /* กล่องรวมตัวหมุนและข้อความ */
        .loader-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.85); /* พื้นหลังขาวโปร่งแสงให้ดูน่ารักเข้ากับภาพ */
            padding: 20px 35px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* วงกลมหมุนรอโหลด (Spinner) */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #d32f2f; /* สีแดงเข้ากับธีมจีน-ไทย */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="splash-screen">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loading-text">กำลังโหลด...</div>
        </div>
    </div>

    <script>
        // ตั้งเวลา 3000 มิลลิวินาที (3 วินาที) แล้วเปลี่ยนหน้าไปที่ chinese_tour.html
        setTimeout(function() {
            window.location.href = "menu.html"
        }, 3000);
    </script>

</body>
</html>
